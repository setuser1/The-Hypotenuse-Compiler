name: Weekly Pre-release

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * FRI'
  workflow_dispatch:

jobs:
  build-x86_64:
    name: Build x86_64 release package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build x86_64 binary
        run: make build

      - name: Package x86_64 release
        run: |
          mkdir -p release/package
          cp makefile.weekly release/package/makefile
          cp -r plstd release/package/
          cp dist/hypotenuse release/package/hypotenuse
          cd release/package
          zip -r ../hypotenuse-x86_64.zip makefile plstd hypotenuse

      - name: Upload x86_64 package
        uses: actions/upload-artifact@v7
        with:
          name: hypotenuse-x86_64
          path: release/hypotenuse-x86_64.zip

  release:
    name: Create GitHub prerelease
    runs-on: ubuntu-latest
    needs: [build-x86_64]

    steps:
      - uses: actions/checkout@v7
      - name: Download x86_64 package
        uses: actions/download-artifact@v8
        with:
          name: hypotenuse-x86_64
          path: release

      - name: Compute release version
        id: version
        run: |
          VERSION=$(date -u +'%y.%V')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: "Weekly prerelease ${{ steps.version.outputs.version }}"
          body: |
            Weekly pre-release packages built every Friday.
            Includes Makefile, plstd library, and the actual compiler binary.
            **Could be unstable, use with caution!**
          draft: false
          prerelease: true

      - name: Upload x86_64 package
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/hypotenuse-x86_64.zip
          asset_name: hypotenuse-x86_64.zip
          asset_content_type: application/zip
